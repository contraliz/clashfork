[package]
name = "clashfork"
version = "1.0.12"
description = "Clashfork desktop client"
authors = ["Clashfork contributors"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
default-run = "clashfork"

[lib]
name = "clashfork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "process"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "gzip", "json", "stream"] }
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
parking_lot = "=0.12.5"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
sha2 = "=0.11.1"
base64 = "=0.22.1"
url = "=2.5.8"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
futures-util = "=0.3.34"
clashfork_service_ipc = { path = "../vendor/clashfork-service-ipc", features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "deny"
